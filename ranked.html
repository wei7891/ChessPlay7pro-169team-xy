/* ============================================================
   Online room session (polls every 0.5s, append-only moves)
   ============================================================ */
const RoomSession = {
  code:null, pollT:null, tickT:null, busy:false,
  rec:null, state:null, viewState:null, accepted:[],
  optimistic:[], moveRecs:[], chatRecs:[],
  sel:null, leg:[], tab:'moves',
  finished:false, resultShown:false, cleanupDone:false, notFound:false,
  chatAtBottom:true,
  chatLoaded:false,
  layoutKey:null, movesSig:null, chatSig:null, lastSeenChat:0,
  drawPromptKey:null, lastRejKey:null,

  open(code){
    const R=this;
    R.code=code;
    RANK.rtimes=[]; RANK.verified=false; RANK.verifyOpen=false;
    Object.assign(R,{rec:null,state:null,viewState:null,accepted:[],optimistic:[],moveRecs:[],chatRecs:[],
      sel:null,leg:[],tab:'moves',finished:false,resultShown:false,cleanupDone:false,notFound:false,chatLoaded:false,
      layoutKey:null,movesSig:null,chatSig:null,lastSeenChat:0,drawPromptKey:null,lastRejKey:null,
      sfxStatus:null,sfxMoveCount:0,
      myTurnSeen:-1,myTurnStartedAt:0});
    $('#roomScreen').classList.remove('hidden');
    $('#roomTitle').textContent=t('room_loading');
    $('#roomSubtitle').textContent='';
    $('#roomDelete').classList.add('hidden');
    $('#roomBody').innerHTML='';
    $('#roomBody').appendChild(stateBox('loading',t('room_loading')));
    touchRecent(code);
    clearInterval(R.pollT); clearInterval(R.tickT);
    R.pollT=setInterval(()=>R.poll(),500);
    R.tickT=setInterval(()=>R.tick(),250);
    R.poll();
  },
  close(){
    clearInterval(this.pollT); clearInterval(this.tickT);
    $('#roomScreen').classList.add('hidden');
    $('#modalRoot').innerHTML='';
  },

  async mergeSet(patch){
    const latest=await DB.get(ROOMS,this.code);
    if(!latest) return;
    const data=Object.assign({},latest.data,patch);
    await DB.set(ROOMS,this.code,data);
    this.rec={...latest,data};
  },

  async poll(){
    const R=this;
    if(R.busy||!DB) return;
    R.busy=true;
    try{
      const rec=await DB.get(ROOMS,R.code);
      if(!rec){
        if(!R.finished){ R.notFound=true; R.renderNotFound(); }
        return;
      }
      R.rec=rec; R.notFound=false;
      const coll=MOVES(R.code), ccoll=CHATS(R.code);
      let mr;
      try{
        mr=await DB.list(coll,{page:1,pageSize:100});
        if(mr.totalPages>1){
          for(let p=2;p<=Math.min(mr.totalPages,20);p++){
            const more=await DB.list(coll,{page:p,pageSize:100});
            mr.items=mr.items.concat(more.items||[]);
          }
        }
      }catch(e){ mr={items:[]}; }
      let cr;
      try{ cr=await DB.list(ccoll,{page:1,pageSize:100}); }catch(e){ cr={items:[]}; }
      R.moveRecs=mr.items||[];
      R.chatRecs=(cr.items||[]).slice().sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
      R.buildCanonical();
      await R.reconcile();
      R.render();
    }catch(e){
      if(!R.rec&&!R.finished) R.renderError();
    }finally{ R.busy=false; }
  },

  buildCanonical(){
    const R=this;
    const sorted=R.moveRecs.slice().sort((a,b)=>
      (a.data.seq-b.data.seq)||String(a.createdAt).localeCompare(String(b.createdAt)));
    let s=CG.newGame(); const acc=[];
    for(const r of sorted){
      const d=r.data;
      if(d.seq!==acc.length) continue;
      const mv=CG.legal(s).find(m=>m.from===d.from&&m.to===d.to&&(m.promo||null)===(d.promo||null));
      if(!mv) continue;
      s=CG.apply(s,mv);
      acc.push({rec:r,mv});
    }
    R.state=s; R.accepted=acc;
    let vs=CG.newGame();
    acc.forEach(a=>vs=CG.apply(vs,a.mv));
    R.optimistic=R.optimistic.filter(o=>{
      if(o.seq<acc.length) return false;
      if(o.seq===acc.length){
        const ok=CG.legal(vs).some(m=>m.from===o.mv.from&&m.to===o.mv.to&&(m.promo||null)===(o.mv.promo||null));
        if(ok) vs=CG.apply(vs,o.mv);
        return ok;
      }
      return false;
    });
    R.viewState=vs;
  },

  async reconcile(){
    const R=this, d=R.rec.data;
    if(d.status==='waiting'){
      if(!d.mass&&d.seats&&d.seats.w&&d.seats.b){
        const now=Date.now();
        try{ await R.mergeSet({status:'active',startedAt:now,lastMoveAt:now}); }catch(e){}
      }
      return;
    }
    if(d.status!=='active'){
      if(!R.finished){ R.finished=true; R.scheduleCleanup(); }
      return;
    }
    const oc=CG.outcome(R.state);
    const seq=R.accepted.length;
    const patch={};
    // a move by the offeree implicitly declines a pending draw offer
    if(d.draw&&R.accepted.some(a=>a.mv.color!==d.draw.by&&a.rec.data.seq>=(d.draw.seq||0))){
      patch.draw=null;
    }
    if(d.seq!==seq){
      patch.seq=seq; patch.turn=R.state.turn;
      if(seq){ const last=R.accepted[seq-1]; const ts=Date.parse(last.rec.createdAt)||last.rec.data.t; if(ts) patch.lastMoveAt=ts; }
    }
    if(oc.over){
      patch.status='finished';
      patch.result={winner:oc.winner,reason:oc.reason};
    } else if(d.time>0 && d.lastMoveAt && d.seq===seq){
      if(Date.now()-d.lastMoveAt>d.time*1000){
        patch.status='finished';
        patch.result={winner:d.turn==='w'?'b':'w',reason:'timeout'};
      }
    }
    if(Object.keys(patch).length){
      try{ await R.mergeSet(patch); }
      catch(e){ if(patch.status==='finished') toast(t('room_errFinish'),'err'); }
      if(patch.status==='finished'){ R.finished=true; R.scheduleCleanup(); }
    }
  },

  scheduleCleanup(){
    const R=this;
    if(R.cleanupDone) return;
    R.cleanupDone=true;
    setTimeout(()=>R.cleanup(),12000);
  },
  async cleanup(){
    const R=this;
    try{
      for(const cf of [MOVES(R.code),CHATS(R.code)]){
        let items=[];
        try{ items=await listAll(cf); }catch(e){ items=[]; }
        for(const r of items){ try{ await DB.remove(cf,r.id); }catch(e){} }
      }
    }catch(e){}
    try{ await DB.remove(ROOMS,R.code); }catch(e){}
  },

  /* ---------- rendering ---------- */
  renderNotFound(){
    const R=this;
    $('#roomTitle').textContent='—';
    $('#roomBody').innerHTML='';
    const box=stateBox('error',t('room_notFound'));
    const b=el('button','btn',t('room_goPlay')); b.style.marginTop='14px';
    b.onclick=()=>{ R.close(); showView('play'); };
    box.appendChild(b);
    $('#roomBody').appendChild(box);
  },
  renderError(){
    const R=this;
    const box=$('#roomBody');
    if(box.querySelector('.state-box')) return;
    box.innerHTML='';
    const b=el('button','btn sm secondary',t('retry')); b.style.marginTop='12px';
    b.onclick=()=>R.poll();
    box.appendChild(stateBox('error',t('room_loadErr'),b));
  },

  render(){
    const R=this;
    if(!R.rec||R.notFound) return;
    const d=R.rec.data;
    $('#roomTitle').textContent=d.name||('Room '+R.code);
    $('#roomSubtitle').textContent=modeLabel(d.mode)+' · '+(d.time?modeTimeLabel(d.mode):t('room_unlimited'))+' · '+R.code.toUpperCase();
    const phase=(d.status==='waiting'&&!d.mass)?'waiting':'game';
    const myColor=R.mySeatColor(d);
    const key=phase+'|'+(myColor||'')+'|'+R.tab;
    const body=$('#roomBody');
    if(R.layoutKey!==key||!body.querySelector('.room-wrap')){
      // structural rebuild: phase / seat color / side-tab changed
      R.layoutKey=key;
      R.movesSig=null; R.chatSig=null;
      body.innerHTML='';
      const wrap=el('div','room-wrap');
      const left=el('div','room-left');
      const right=el('div','room-side');
      R.buildSide(right,d);
      wrap.append(left,right);
      body.appendChild(wrap);
    }
    const left=body.querySelector('.room-left');
    left.innerHTML='';
    if(phase==='waiting') R.buildWaiting(left);
    else R.buildGame(left,d);

    R.refreshMoves();
    R.refreshChat();
    R.trackTurn(d);

    // sound effects: game start, moves (remote only; own moves sound in submitMove)
    if(d.status==='active'&&R.sfxStatus!=='active') sfxPlay('start');
    const ply=R.accepted.length+R.optimistic.length;
    if((d.status==='active'||d.status==='finished')&&ply>R.sfxMoveCount){
      R.sfxMoveCount=ply;
      sfxAfterState(R.viewState);
    }
    R.sfxStatus=d.status;

    // draw offer UI: incoming prompt, rejection notice, cooldown
    if(d.status==='active'){
      R.maybeDrawPrompt(d);
      R.maybeRejectionToast(d);
    }
    if(d.status==='finished'&&!R.resultShown){
      R.resultShown=true;
      R.drawPromptKey=null;
      $('#modalRoot').innerHTML='';
      R.showResult(d);
    }
    R.tick();
  },

  maybeDrawPrompt(d){
    const R=this;
    const my=R.mySeatColor(d);
    if(!my||!d.draw||d.draw.by===my) return;
    const key=d.draw.by+'@'+d.draw.at;
    if(R.drawPromptKey===key) return;
    R.drawPromptKey=key;
    const m=el('div','modal');
    m.append(el('h2',null,t('draw_offerTitle')),el('p',null,t('draw_offerDesc')));
    const acts=el('div','modal-actions');
    const yes=el('button','btn',t('draw_accept'));
    const no=el('button','btn secondary',t('draw_decline'));
    acts.append(yes,no); m.appendChild(acts);
    const {close}=openModal(m);
    yes.onclick=()=>{ close(); R.drawPromptKey=null; R.acceptDraw(); };
    no.onclick=()=>{ close(); R.drawPromptKey=null; R.declineDraw(); };
  },

  maybeRejectionToast(d){
    const R=this;
    const my=R.mySeatColor(d);
    const rej=d.drawRej;
    if(!my||!rej||rej.by!==my) return;
    const key=rej.by+'@'+rej.at;
    if(R.lastRejKey===key) return;
    R.lastRejKey=key;
    if(Date.now()-(rej.at||0)<60000) toast(t('draw_rejected'),'err');
  },

  async offerDraw(){
    const R=this;
    const d=R.rec.data, color=R.mySeatColor(d);
    if(!color||d.mass||d.status!=='active'||d.draw) return;
    if(d.drawRej&&d.drawRej.by===color&&Date.now()-(d.drawRej.at||0)<30000) return;
    if(!await confirmModal(t('draw_confirm'))) return;
    try{
      await R.mergeSet({draw:{by:color,at:Date.now(),seq:R.accepted.length}});
      R.poll();
    }catch(e){ toast(t('room_errFinish'),'err'); }
  },

  trackTurn(d){
    const R=this;
    const myColor=R.mySeatColor(d);
    const mine=d.status==='active'&&myColor&&R.viewState.turn===myColor;
    const sig=R.accepted.length;
    if(mine&&R.myTurnSeen!==sig){
      R.myTurnSeen=sig;
      R.myTurnStartedAt=performance.now();
    }
  },

  noteLatency(ms){
    const R=this;
    if(!RANK.verifyOpen) RANK.rtimes.push(ms);
    const last3=RANK.rtimes.slice(-3);
    if(last3.length<3) return;
    const allFast=last3.every(x=>x<250);
    const same=Math.max.apply(null,last3)-Math.min.apply(null,last3)<=2;
    if(!allFast&&!same) return;
    RANK.rtimes=[];
    if(RANK.verified){
      RANK.foreverBan();
    }else{
      RANK.openVerify();
    }
  },

  async resign(){
    const R=this,d=R.rec.data;
    const color=R.mySeatColor(d);
    if(!color||d.mass) return;
    if(!await confirmModal(t('room_resignConfirm'))) return;
    const early=d.startedAt&&Date.now()-d.startedAt<30000;
    try{
      await R.mergeSet({status:'finished',result:{winner:color==='w'?'b':'w',reason:'resign'},draw:null});
      R.finished=true; R.scheduleCleanup();
      if(early) toast(t('rk_warnTitle')+' · '+t('rk_negPlay'),'err');
      R.poll();
    }catch(e){ toast(t('room_errFinish'),'err'); }
  },

  async acceptDraw(){
    const R=this;
    try{
      await R.mergeSet({status:'finished',result:{winner:null,reason:'agree'},draw:null});
      R.finished=true; R.scheduleCleanup();
      R.poll();
    }catch(e){ toast(t('room_errFinish'),'err'); }
  },

  async declineDraw(){
    const R=this;
    const d=R.rec.data;
    if(!d.draw) return;
    try{
      await R.mergeSet({draw:null,drawRej:{by:d.draw.by,at:Date.now()}});
      R.poll();
    }catch(e){ toast(t('room_errFinish'),'err'); }
  },

  refreshMoves(){
    const R=this;
    const mv=$('#mvList');
    if(!mv) return;
    const list=R.plainMoves();
    if(R.movesSig===list.length) return;
    R.movesSig=list.length;
    renderMoves(mv,list);
  },

  refreshChat(){
    const R=this;
    const chat=$('#chatList');
    if(!chat) return;
    const n=R.chatRecs.length;
    if(R.tab==='chat') R.lastSeenChat=n;
    const badge=$('#segChat');
    if(badge){
      const unread=n-(R.lastSeenChat||0);
      badge.textContent=t('room_chat')+(R.tab!=='chat'&&unread>0?' ('+unread+')':'');
    }
    const sig=R.chatRecs.map(r=>r.id).join(',');
    if(R.chatSig===sig) return;
    R.chatSig=sig;
    const near=chat.scrollHeight-chat.scrollTop-chat.clientHeight<60;
    chat.innerHTML='';
    if(!n){
      chat.appendChild(el('div','state-box',t('room_chatEmpty')));
      return;
    }
    R.chatRecs.forEach(r=>{
      const d=r.data;
      const m=el('div','msg');
      const top=el('div');
      top.append(el('span','mn',d.name||'?'),el('span','mt',R.timeLabel(r.createdAt||d.t)));
      m.append(top,el('div','mx',String(d.text||'').slice(0,200)));
      chat.appendChild(m);
    });
    if(near||R.chatAtBottom) requestAnimationFrame(()=>{ chat.scrollTop=chat.scrollHeight; });
  },

  buildWaiting(left){
    const R=this,d=R.rec.data;
    const card=el('div','card');
    card.appendChild(el('div','small muted',t('room_code'))).style.marginBottom='6px';
    const pill=el('div','code-pill',R.code.toUpperCase());
    const copy=el('button','btn sm secondary',t('room_copy'));
    copy.onclick=()=>{
      const doCopy=()=>{ toast(t('room_copied'),'ok'); };
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(R.code.toUpperCase()).then(doCopy).catch(()=>doCopy());
      else doCopy();
    };
    card.append(pill,copy);
    card.appendChild(el('div','note',t('room_waitHint'))).style.marginTop='12px';
    const seats=el('div'); seats.style.marginTop='12px';
    ['w','b'].forEach(color=>{
      const seat=d.seats&&d.seats[color];
      const mine=seat&&seat.id===ME.id;
      const row=el('div','seat'+(mine?' you':''));
      row.appendChild(el('div','piece',color==='w'?'♔':'♚'));
      const inf=el('div','sinfo');
      inf.appendChild(el('div','sname',seat?seat.name:t('room_seatEmpty')));
      inf.appendChild(el('div','sstatus',seat?(mine?(LANG==='zh'?'（你）':'(you)'):''):t('room_seatEmpty')));
      const btn=el('button','btn sm '+(mine?'secondary':'ghost'),mine?t('room_leaveSeat'):t('room_takeSeat'));
      btn.disabled=!!(seat&&!mine);
      btn.addEventListener('click',async()=>{
        try{ await R.takeSeat(color); }catch(e){ toast(t('room_errSeat'),'err'); }
        R.poll();
      });
      row.append(inf,btn); seats.appendChild(row);
    });
    card.appendChild(seats);
    left.appendChild(card);
    if(d.creator&&d.creator.id===ME.id){
      $('#roomDelete').classList.remove('hidden');
    }
  },

  buildGame(left,d){
    const R=this;
    $('#roomDelete').classList.add('hidden');
    const myColor=R.mySeatColor(d);
    const flip=myColor==='b';
    const players=el('div','players');
    const order=flip?['w','b']:['b','w'];
    order.forEach(color=>{
      const seat=d.seats&&d.seats[color];
      const turn=R.viewState.turn===color&&d.status==='active';
      const row=el('div','player'+(turn?' turn':''));
      const av=el('div','avatar');
      if(seat) av.textContent=initials(seat.name); else av.textContent=color==='w'?'♔':'♚';
      const inf=el('div','pinfo');
      inf.appendChild(el('div','pname',seat?seat.name:(color==='w'?t('room_white'):t('room_black'))));
      const sub=el('div','psub');
      if(seat&&seat.id===ME.id) sub.textContent='';
      else if(!seat) sub.textContent=d.mass?'∞':t('room_seatEmpty');
      inf.appendChild(sub);
      const tm=el('div','timer'+(d.time?'':' off'),'');
      tm.id='timer'+color;
      row.append(av,inf,tm); players.appendChild(row);
    });
    left.appendChild(players);

    const boardWrap=el('div'); boardWrap.style.margin='10px 0';
    const board=el('div','board');
    const moves=R.plainMoves();
    const last=moves.length?moves[moves.length-1]:null;
    const legalSet=new Set(R.sel==null?[]:R.leg.map(m=>m.to));
    renderBoard(board,R.viewState,{
      flip,selected:R.sel,legalSet,lastMove:last,
      onSquare:d.status==='active'?(i=>R.click(i)):null
    });
    boardWrap.appendChild(board); left.appendChild(boardWrap);

    const under=el('div','under-board');
    const st=el('span','status');
    if(d.status==='finished'){
      st.textContent='';
    } else if(R.canControl(R.viewState.turn,d)){
      st.textContent=t('room_yourTurn');
    } else if(myColor){
      st.textContent=t('room_theirTurn');
    } else {
      st.textContent=t('room_spectating')+(d.mass?' · '+t('room_massHint'):'');
    }
    under.appendChild(st);
    if(!d.mass&&myColor&&d.status==='active'){
      const grp=el('span','under-btns');
      const dbBtn=el('button','btn sm',t('draw_btn')+' 🤝');
      dbBtn.id='drawBtn';
      const r=el('button','btn sm danger',t('room_resign')+' 🏳️');
      r.id='resignBtn';
      const draw=d.draw||null, rej=d.drawRej||null;
      let cd=0;
      if(rej&&rej.by===myColor) cd=Math.max(0,30-Math.floor((Date.now()-(rej.at||0))/1000));
      if(draw&&draw.by===myColor){ dbBtn.disabled=true; dbBtn.textContent=t('draw_waiting'); }
      else if(draw){ dbBtn.disabled=true; dbBtn.textContent=t('draw_pending'); }
      else if(cd>0){ dbBtn.disabled=true; dbBtn.textContent=t('draw_btn')+' 🤝 '+cd+'s'; }
      dbBtn.addEventListener('click',()=>R.offerDraw());
      r.addEventListener('click',()=>R.resign());
      grp.append(dbBtn,r);
      under.appendChild(grp);
    }
    left.appendChild(under);
    if(d.mass){
      const n=el('div','note',t('room_massHint')); n.style.marginTop='10px';
      left.appendChild(n);
    }
  },

  buildSide(right,d){
    const R=this;
    const seg=el('div','seg'); seg.style.marginBottom='10px';
    const bM=el('button',R.tab==='moves'?'on':'',t('room_moves'));
    const bC=el('button',R.tab==='chat'?'on':'',t('room_chat'));
    bC.id='segChat';
    bM.onclick=()=>{ R.tab='moves'; R.render(); };
    bC.onclick=()=>{ R.tab='chat'; R.chatAtBottom=true; R.lastSeenChat=R.chatRecs.length; R.render(); };
    seg.append(bM,bC);
    right.appendChild(seg);

    const panel=el('div','panel');
    const mv=el('div','moves'); mv.id='mvList';
    if(R.tab!=='moves') mv.classList.add('hidden');
    panel.appendChild(mv);

    const chat=el('div','chat'); chat.id='chatList';
    if(R.tab!=='chat') chat.classList.add('hidden');
    panel.appendChild(chat);

    // input box lives OUTSIDE the chat list, so 0.5s refreshes never destroy it
    const input=el('div','chat-input');
    const ed=el('input'); ed.maxLength=200; ed.placeholder=t('room_chatPlaceholder');
    ed.setAttribute('aria-label',t('room_chat'));
    const send=el('button',null,'➤');
    send.setAttribute('aria-label',t('room_send'));
    const doSend=async()=>{
      const text=ed.value.trim();
      if(!text||!DB) return;
      ed.disabled=true;
      try{
        await DB.add(CHATS(R.code),{id:ME.id,name:ME.name,text:text.slice(0,200),t:Date.now()});
        ed.value='';
        R.tab='chat';
        R.chatAtBottom=true;
        R.chatSig=null;
        R.poll();
      }catch(e){ toast(t('room_errChat'),'err'); }
      ed.disabled=false;
      ed.focus();
    };
    send.onclick=doSend;
    ed.addEventListener('keydown',e=>{ if(e.key==='Enter') doSend(); });
    input.append(ed,send);
    if(R.tab!=='chat') input.classList.add('hidden');
    chat.addEventListener('scroll',()=>{ R.chatAtBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<60; });
    panel.appendChild(input);
    right.appendChild(panel);
  },

  timeLabel(ts){
    const dt=new Date(ts);
    if(isNaN(dt)) return '';
    return String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
  },

  plainMoves(){
    const R=this;
    const list=R.accepted.map(a=>({from:a.mv.from,to:a.mv.to,promo:a.mv.promo||null}));
    R.optimistic.forEach(o=>list.push({from:o.mv.from,to:o.mv.to,promo:o.mv.promo||null}));
    return list;
  },

  mySeatColor(d){
    if(d.mass) return null;
    if(d.seats&&d.seats.w&&d.seats.w.id===ME.id) return 'w';
    if(d.seats&&d.seats.b&&d.seats.b.id===ME.id) return 'b';
    return null;
  },
  canControl(color,d){
    if(!d||d.status!=='active') return false;
    if(d.mass) return true;
    const s=d.seats&&d.seats[color];
    return !!s&&s.id===ME.id;
  },

  async click(i){
    const R=this;
    if(!R.rec||R.rec.data.status!=='active') return;
    const d=R.rec.data;
    const s=R.viewState;
    if(R.sel==null){
      const p=s.board[i];
      if(p&&p[0]===s.turn&&R.canControl(s.turn,d)){
        R.sel=i; R.leg=CG.legal(s).filter(m=>m.from===i);
      }
      R.render(); return;
    }
    if(i===R.sel){ R.sel=null; R.leg=[]; R.render(); return; }
    const ms=R.leg.filter(m=>m.to===i);
    if(ms.length){
      let mv=ms[0];
      if(ms.length>1){
        const q=await askPromo(s.turn);
        if(!q){ R.render(); return; }
        mv=ms.find(x=>x.promo===q);
      }
      R.sel=null; R.leg=[];
      R.submitMove(mv);
    } else {
      const p=s.board[i];
      if(p&&p[0]===s.turn&&R.canControl(s.turn,d)){
        R.sel=i; R.leg=CG.legal(s).filter(m=>m.from===i);
      } else { R.sel=null; R.leg=[]; }
      R.render();
    }
  },

  async submitMove(mv){
    const R=this;
    const seq=R.accepted.length;
    const key=seq+':'+mv.from+':'+mv.to+':'+(mv.promo||'');
    if(R.optimistic.some(o=>o.key===key)) return;
    R.optimistic.push({key,seq,mv});
    if(R.myTurnStartedAt) R.noteLatency(performance.now()-R.myTurnStartedAt);
    R.buildCanonical();
    sfxAfterState(R.viewState);
    R.sfxMoveCount=R.accepted.length+R.optimistic.length;
    R.render();
    try{
      await DB.add(MOVES(R.code),{
        seq,from:mv.from,to:mv.to,promo:mv.promo||null,
        color:R.state.turn,byId:ME.id,byName:ME.name,t:Date.now()
      });
    }catch(e){
      R.optimistic=R.optimistic.filter(o=>o.key!==key);
      R.sfxMoveCount=R.accepted.length+R.optimistic.length;
      toast(t('room_errMove'),'err');
    }
    R.poll();
  },

  async takeSeat(color){
    const R=this;
    const latest=await DB.get(ROOMS,R.code);
    if(!latest||latest.data.status!=='waiting') return;
    const d=latest.data;
    const seats={w:d.seats&&d.seats.w?{...d.seats.w}:null,b:d.seats&&d.seats.b?{...d.seats.b}:null};
    if(seats[color]&&seats[color].id===ME.id){ seats[color]=null; }
    else if(!seats[color]){
      seats[color]={id:ME.id,name:ME.name};
      const other=color==='w'?'b':'w';
      if(seats[other]&&seats[other].id===ME.id) seats[other]=null;
    }
    await DB.set(ROOMS,R.code,Object.assign({},d,{seats}));
  },

  tick(){
    const R=this;
    const w=$('#timerW'), b=$('#timerB');
    if(!w||!b||!R.rec) return;
    const d=R.rec.data;
    [w,b].forEach(tm=>{
      const color=tm.id==='timerW'?'w':'b';
      if(!d.time){ tm.textContent='∞'; tm.className='timer off'; return; }
      if(d.status!=='active'){ tm.textContent=fmtClock(d.time*1000); tm.className='timer'; return; }
      if(R.viewState.turn!==color){ tm.textContent=fmtClock(d.time*1000); tm.className='timer'; return; }
      const rem=d.time*1000-(Date.now()-(d.lastMoveAt||Date.now()));
      tm.textContent=fmtClock(rem);
      tm.className='timer'+(rem<10000?' low':'');
    });
  },

  async settle(d){
    const R=this,res=d.result||{};
    const myColor=R.mySeatColor(d);
    sfxResult(res.winner,myColor);
    const key='ranked_done_'+R.code;
    const lines=[];
    let before=RANK.me?RANK.me.score:0, after=before, headTitle='', headIcon='♛';
    if(myColor&&DB&&!ME.guest&&!Store.get(key)){
      Store.set(key,1);
      try{
        const p=await ensureProfile();
        before=p.score;
        const iWon=res.winner===myColor;
        const early=res.reason==='resign'&&!iWon&&d.startedAt&&Date.now()-d.startedAt<30000;
        const timeoutLoss=res.reason==='timeout'&&!iWon;
        let delta=0;
        if(early){
          headTitle=t('rk_warnTitle'); headIcon='⚠';
          lines.push([t('rk_negPlay'),-20]);
          delta=-20;
          await saveProfile({score:Math.max(0,before+delta),warns:(p.warns||0)+1});
        }else if(timeoutLoss){
          headTitle=t('rk_ban24'); headIcon='⛔';
          lines.push([t('rk_malicious'),-20]);
          delta=-20;
          await saveProfile({score:Math.max(0,before+delta),banUntil:Date.now()+24*3600*1000});
        }else{
          if(res.winner==null){ headTitle=t('rk_drawLine'); headIcon='⚖'; lines.push([t('rk_drawLine'),+5]); delta+=5; }
          else if(iWon){ headTitle=t('rk_winLine'); headIcon='♛'; lines.push([t('rk_winLine'),+10]); delta+=10; }
          else{
            headTitle=t('rk_lossLine'); headIcon='♔';
            lines.push([t('rk_lossLine'),-8]); delta-=8;
            if(tierOf(before).idx<=2){ lines.push([t('rk_protect'),+2]); delta+=2; }
          }
          lines.push([t('rk_clean'),+2]); delta+=2;
          after=Math.max(0,before+delta);
          await saveProfile({score:after});
        }
        after=RANK.me?RANK.me.score:after;
      }catch(e){}
    }else if(!myColor){
      headTitle=res.winner==null?t('r_draw'):(res.winner==='w'?t('r_whiteWin'):t('r_blackWin'));
    }else{
      headTitle=res.winner==null?t('r_draw'):(res.winner==='w'?t('r_whiteWin'):t('r_blackWin'));
    }
    const m=el('div','modal result-card');
    m.style.position='relative';
    // save replay tape (local only)
    const moves=R.accepted.map(a=>({from:a.mv.from,to:a.mv.to,promo:a.mv.promo||null}));
    const replayKey='rank_replay_saved_'+R.code;
    const saveBtn=el('button','tbtn replay-save-btn');
    saveBtn.style.cssText='position:absolute;top:10px;left:10px;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--g700);background:rgba(255,255,255,.85)';
    const drawSaveBtn=()=>{ saveBtn.textContent=localStorage.getItem(replayKey)?t('rk_savedReplay'):t('rk_saveReplay'); saveBtn.disabled=!!localStorage.getItem(replayKey); saveBtn.style.opacity=saveBtn.disabled?'.55':'1'; };
    drawSaveBtn();
    saveBtn.onclick=()=>{
      try{
        const list=JSON.parse(localStorage.getItem('chessplay_replays')||'[]');
        const opp=myColor?((d.seats&&d.seats[myColor==='w'?'b':'w'])||{}):{};
        const rec={id:'rp'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
          at:Date.now(),mode:'ranked',myColor,winner:res.winner==null?null:res.winner,reason:res.reason||'checkmate',
          before,after,tierIdx:tierOf(after).idx,oppName:opp.name||'—',moves:moves.slice(),fav:false};
        list.unshift(rec);
        localStorage.setItem('chessplay_replays',JSON.stringify(list.slice(0,200)));
        localStorage.setItem(replayKey,'1');
        drawSaveBtn();
        toast(LANG==='zh'?'录像带已保存':'Replay saved','ok');
      }catch(e){ toast(LANG==='zh'?'保存失败':'Save failed','err'); }
    };
    if(myColor&&moves.length) m.appendChild(saveBtn);
    m.append(el('div','rc',headIcon));
    m.append(el('h2',null,headTitle));
    if(lines.length){
      const box=el('div'); box.style.width='100%'; box.style.margin='4px 0 10px';
      lines.forEach(([txt,val])=>{
        const row=el('div','delta-line');
        row.append(el('span',null,txt),el('span',val>=0?'delta-pos':'delta-neg',(val>=0?'+':'')+val));
        box.appendChild(row);
      });
      const tot=el('div','delta-line');
      const l=el('span',null,t('rk_newScore')); l.style.fontWeight='800';
      const rs=el('span',null,before+' → '+after); rs.style.fontWeight='900'; rs.style.color='var(--gold)';
      tot.append(l,rs);
      box.appendChild(tot);
      const ti=tierOf(after);
      const tierRow=el('div','tier-card');
      const badge=el('div','tier-badge'); badge.style.width='54px'; badge.style.height='54px'; tierIcon(badge,ti.idx);
      const tinf=el('div');
      tinf.append(el('div','tn',t('rk_t'+ti.idx)),el('div','small muted',ti.pts+'/100'));
      tierRow.append(badge,tinf);
      m.append(box,tierRow);
    }else{
      m.append(el('p',null,t('r_'+(res.reason||'checkmate'))||''));
    }
    const acts=el('div','modal-actions');
    const back=el('button','btn',t('rk_continue'));
    back.onclick=()=>{ c(); R.cleanup(); R.close(); showView('play'); loadMatchList(); };
    acts.append(back); m.append(acts);
    const {close:c}=openModal(m);
  },

  showResult(d){ this.settle(d); }
};

function enterRoom(code){ RoomSession.open(code); }
$('#roomBack').addEventListener('click',()=>{
  const R=RoomSession;
  if(R.finished) R.cleanup();
  R.close();
  showView('play');
});
$('#roomDelete').addEventListener('click',async()=>{
  const R=RoomSession;
  if(!await confirmModal(t('room_cancelConfirm'))) return;
  await R.cleanup();
  R.close();
  toast(t('room_deleteOk'),'ok');
  showView('play');
});

/* ============================================================
   Bootstrap
   ============================================================ */
(async function init(){
  applyI18n();
  try{ await loadIdentity(); }catch(e){ /* guest fallback */ }
  showView('play');
  if(AUTH){
    try{
      const u=await AUTH.getUser();
      if(u){
        await loadIdentity();
        try{ await loadMyProfile(); }catch(e){}
        const v=$('.nav-item.active').dataset.view; showView(v);
      }
    }catch(e){}
  }
})();

</script>
